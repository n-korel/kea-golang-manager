{
  "Dhcp4": {
    "allocator": "iterative",
    "authoritative": false,
    "boot-file-name": "",
    "calculate-tee-times": false,
    "control-socket": {
      "socket-name": "/kea/sockets/kea-dhcp4-ctrl.sock",
      "socket-type": "unix"
    },
    "ddns-conflict-resolution-mode": "check-with-dhcid",
    "ddns-generated-prefix": "myhost",
    "ddns-override-client-update": false,
    "ddns-override-no-update": false,
    "ddns-qualifying-suffix": "",
    "ddns-replace-client-name": "never",
    "ddns-send-updates": true,
    "ddns-update-on-renew": false,
    "decline-probation-period": 86400,
    "dhcp-ddns": {
      "enable-updates": false,
      "max-queue-size": 1024,
      "ncr-format": "JSON",
      "ncr-protocol": "UDP",
      "sender-ip": "0.0.0.0",
      "sender-port": 0,
      "server-ip": "127.0.0.1",
      "server-port": 53001
    },
    "dhcp-queue-control": {
      "capacity": 64,
      "enable-queue": false,
      "queue-type": "kea-ring4"
    },
    "dhcp4o6-port": 0,
    "early-global-reservations-lookup": false,
    "echo-client-id": true,
    "expired-leases-processing": {
      "flush-reclaimed-timer-wait-time": 25,
      "hold-reclaimed-time": 3600,
      "max-reclaim-leases": 100,
      "max-reclaim-time": 250,
      "reclaim-timer-wait-time": 10,
      "unwarned-reclaim-cycles": 5
    },
    "hooks-libraries": [ ],
    "host-reservation-identifiers": [ "hw-address", "duid", "circuit-id", "client-id" ],
    "hostname-char-replacement": "",
    "hostname-char-set": "[^A-Za-z0-9.-]",
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "re-detect": false
    },
    "ip-reservations-unique": true,
    "lease-database": {
      "name": "/kea/leases/kea-dhcp4.leases",
      "type": "memfile"
    },
    "match-client-id": true,
    "multi-threading": {
      "enable-multi-threading": true,
      "packet-queue-size": 64,
      "thread-pool-size": 0
    },
    "next-server": "0.0.0.0",
    "option-data": [ ],
    "option-def": [ ],
    "parked-packet-limit": 256,
    "rebind-timer": 2000,
    "renew-timer": 1000,
    "reservations-global": false,
    "reservations-in-subnet": true,
    "reservations-lookup-first": false,
    "reservations-out-of-pool": false,
    "sanity-checks": {
      "extended-info-checks": "fix",
      "lease-checks": "warn"
    },
    "server-hostname": "",
    "server-tag": "",
    "shared-networks": [ ],
    "stash-agent-options": false,
    "statistic-default-sample-age": 0,
    "statistic-default-sample-count": 20,
    "store-extended-info": false,
    "subnet4": [ ],
    "t1-percent": 0.5,
    "t2-percent": 0.875,
    "valid-lifetime": 4000
  }
}