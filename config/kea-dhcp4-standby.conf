{
  "Dhcp4": {
    "allocator": "iterative",
    "authoritative": false,
    "control-socket": {
      "socket-name": "/kea/sockets/kea-dhcp4-ctrl.sock",
      "socket-type": "unix"
    },
    "interfaces-config": {
      "interfaces": ["*"],
      "re-detect": true
    },
    "lease-database": {
      "name": "/kea/leases/kea-dhcp4.leases",
      "type": "memfile"
    },
    "hooks-libraries": [
      {
        "library": "/usr/local/lib/kea/hooks/libdhcp_ha.so",
        "parameters": {
          "high-availability": [
            {
              "this-server-name": "standby",
              "mode": "passive-backup",
              "heartbeat-delay": 10000,
              "max-unacked-clients": 5,
              "sync-timeout": 60000,
              "peers": [
                {
                  "name": "primary",
                  "url": "http://127.0.0.1:8000/",
                  "role": "primary"
                },
                {
                  "name": "standby",
                  "url": "http://127.0.0.1:8001/",
                  "role": "standby"
                }
              ]
            }
          ]
        }
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.1.0/24",
        "pools": [
          { "pool": "192.168.1.10-192.168.1.100" },
          { "pool": "192.168.1.150-192.168.1.200" }
        ],
        "valid-lifetime": 4000,
        "renew-timer": 1000,
        "rebind-timer": 2000
      }
    ],
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000
  }
}
